<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Assessment | Capability Methods</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #F3F0FA;
    color: #350F88;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(53, 15, 136, 0.12);
    max-width: 680px;
    width: 100%;
    overflow: hidden;
  }

  .logo-strip {
    background: #ffffff;
    padding: 18px 40px;
    border-bottom: 1px solid #DCD5EE;
  }

  .logo-strip img {
    height: 56px;
    width: auto;
    display: block;
  }

  .card-header {
    background: #350F88;
    padding: 24px 40px 22px;
    color: #fff;
  }

  .card-header h1 {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .card-header p {
    font-size: 15px;
    color: #E3DAF8;
    line-height: 1.5;
  }

  .progress-bar-wrap {
    background: #DCD5EE;
    height: 5px;
  }

  .progress-bar {
    background: #6C4FA3;
    height: 5px;
    transition: width 0.3s ease;
  }

  .card-body {
    padding: 36px 40px 32px;
  }

  /* Welcome screen */
  .welcome-title {
    font-size: 22px;
    font-weight: 700;
    color: #350F88;
    margin-bottom: 12px;
  }

  .welcome-desc {
    font-size: 15px;
    color: #5A5A5A;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .meta-chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .chip {
    background: #F3F0FA;
    color: #350F88;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
  }

  /* Question screen */
  .dimension-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6C4FA3;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    color: #350F88;
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    border: 2px solid #DCD5EE;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
    background: #fff;
  }

  .option:hover {
    border-color: #350F88;
    background: #F3F0FA;
  }

  .option.selected {
    border-color: #350F88;
    background: #F3F0FA;
  }

  .option-dot {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    border: 2px solid #CCCCCC;
    margin-top: 1px;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option.selected .option-dot {
    background: #350F88;
    border-color: #350F88;
  }

  .option.selected .option-dot::after {
    content: '';
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    display: block;
  }

  .option-text {
    font-size: 15px;
    color: #350F88;
    line-height: 1.5;
  }

  /* Navigation */
  .nav {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    padding: 13px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: #350F88;
    color: #fff;
    flex: 1;
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-secondary {
    background: #F3F0FA;
    color: #350F88;
    padding: 13px 20px;
  }

  .btn-secondary:hover { background: #DCD5EE; }

  .btn-cta {
    background: #D41409;
    color: #fff;
    padding: 16px 32px;
    font-size: 16px;
    border-radius: 8px;
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }

  .btn-cta:hover { opacity: 0.9; }

  /* Result screen */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #F3F0FA;
    border-radius: 24px;
    padding: 8px 18px;
    margin-bottom: 20px;
  }

  .result-badge .level-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .result-badge .level-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #350F88;
  }

  .result-score {
    font-size: 48px;
    font-weight: 800;
    color: #350F88;
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-score-label {
    font-size: 13px;
    color: #5A5A5A;
    margin-bottom: 18px;
  }

  .result-desc {
    font-size: 16px;
    color: #5A5A5A;
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .result-services {
    background: #F3F0FA;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 28px;
  }

  .result-services-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5A5A5A;
    margin-bottom: 10px;
  }

  .service-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .service-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #350F88;
  }

  .service-list li::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    min-width: 8px;
    background: #6C4FA3;
    border-radius: 50%;
  }

  .result-cta-wrap {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-retake {
    background: none;
    border: 2px solid #DCD5EE;
    color: #5A5A5A;
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .btn-retake:hover { border-color: #350F88; color: #350F88; }

  .q-counter {
    font-size: 13px;
    color: #5A5A5A;
    margin-left: auto;
  }

  /* Contact step (added: sends results to Salesforce) */
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #5A5A5A; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 2px solid #DCD5EE; border-radius: 8px;
    font-size: 15px; font-family: inherit; color: #350F88;
  }
  .field input:focus { outline: none; border-color: #350F88; }
  .call-check {
    display: flex; gap: 12px; align-items: flex-start; background: #F3F0FA; border: 2px solid #DCD5EE;
    border-radius: 10px; padding: 14px 16px; margin: 6px 0 24px; cursor: pointer; font-size: 15px; line-height: 1.5;
  }
  .call-check input { width: 18px; height: 18px; margin-top: 2px; accent-color: #350F88; }
  .skip-link {
    display: block; margin-top: 16px; background: none; border: none; color: #5A5A5A;
    font-size: 14px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .form-error { color: #A70716; font-size: 14px; margin-bottom: 12px; }
  .fine-print { font-size: 12px; color: #5A5A5A; margin-top: 14px; line-height: 1.5; }
  .hp { position: absolute; left: -5000px; }
  .sent-note {
    background: #F3F0FA; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px;
    font-size: 15px; color: #350F88; line-height: 1.5;
  }

  @media (max-width: 520px) {
    .logo-strip { padding: 14px 20px; }
    .card-header, .card-body { padding: 20px 20px; }
    .card-header h1 { font-size: 20px; }
    .question-text { font-size: 17px; }
    .result-score { font-size: 40px; }
    .btn-cta { width: 100%; text-align: center; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
  }
</style>
<style>
  .field textarea {
    width: 100%; padding: 12px 14px; border: 2px solid #DCD5EE; border-radius: 8px; min-height: 80px;
    font-size: 15px; font-family: inherit; color: #350F88; resize: vertical;
  }
  .field textarea:focus { outline: none; border-color: #350F88; }
  .question-hint { font-size: 13px; color: #5A5A5A; margin: -14px 0 20px; }
  .level-scale { display: flex; gap: 6px; margin-bottom: 24px; }
  .level-scale span { flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 6px 0; border-radius: 6px;
    background: #F3F0FA; color: #5A5A5A; }
  .level-scale span.on { background: #350F88; color: #fff; }
</style>
<style id="cm-fit">html,body{min-height:0 !important;background:transparent !important}body{align-items:flex-start !important;padding:4px 0 24px !important}</style>
</head>
<body>

<div class="card" id="app">
  <!-- Dynamically rendered by JS -->
</div>

<script>
// Salesforce Web-to-Lead (Capability Methods LLC org). Regenerate with build/ai_assessment.py.
const SALESFORCE = {
  "endpoint": "https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DDo000001DALGMA4",
  "oid": "00DDo000001DALGMA4",
  "fields": {
    "date": "00NDo00000ExPzj",
    "notes": "00NDo00000ExPzk",
    "callRequested": "00NDo00000ExPzl",
    "domains": {
      "AIR_Governance": "00NDo00000ExPza",
      "AIR_Inventory": "00NDo00000ExPzc",
      "AIR_Data_Privacy": "00NDo00000ExPzZ",
      "AIR_Risk_Assessment": "00NDo00000ExPzf",
      "AIR_Lifecycle": "00NDo00000ExPzd",
      "AIR_Third_Party": "00NDo00000ExPzg",
      "AIR_Transparency": "00NDo00000ExPzi",
      "AIR_Incident_Response": "00NDo00000ExPzb",
      "AIR_Training_Culture": "00NDo00000ExPzh",
      "AIR_Policy_Docs": "00NDo00000ExPze"
    }
  }
};

const LOGO_HTML = `<div class="logo-strip"><img src="../img/logo.png" alt="Capability Methods" onerror="this.parentElement.style.display='none'"></div>`;

const QUESTIONS = [
  {
    "field": "AIR_Governance",
    "dimension": "AI Governance & Accountability",
    "text": "Who is accountable for how your business uses AI?",
    "options": [
      "No one, AI adoption is ad hoc and leadership has limited awareness of AI risks.",
      "An informal AI champion exists, but accountability depends on individuals and isn't documented.",
      "A formal AI governance framework with defined roles reviews key AI decisions.",
      "AI oversight is embedded in enterprise risk management and reported to the board."
    ]
  },
  {
    "field": "AIR_Inventory",
    "dimension": "AI Inventory & Classification",
    "text": "Do you know which AI tools and systems are in use across the business?",
    "options": [
      "No, teams don't know which applications use AI.",
      "We keep an informal list of known AI tools; risk levels are applied inconsistently.",
      "A formal AI register is kept current, with an owner and risk tier for each system.",
      "A live AI inventory is linked to our systems and traced to the business processes it supports."
    ]
  },
  {
    "field": "AIR_Data_Privacy",
    "dimension": "Data Privacy & Personal Data",
    "text": "How is personal or customer data protected when AI tools use it?",
    "options": [
      "There are no specific controls; we don't know where AI data comes from.",
      "Some datasets are governed, and privacy checks happen on an ad hoc basis.",
      "Privacy assessments are required before any AI tool is deployed; data use is minimized.",
      "Privacy-by-design is built in, with automated detection and monitoring of personal data."
    ]
  },
  {
    "field": "AIR_Risk_Assessment",
    "dimension": "Risk Assessment & Impact",
    "text": "How do you assess the risks and impact of AI before using it?",
    "options": [
      "AI risks aren't formally assessed; awareness is limited to technical staff.",
      "Informal checklists are used for some high-visibility AI uses.",
      "A standard method rates likelihood and impact for every AI system, kept in a risk register.",
      "Risk is quantified and monitored continuously, and reported to leadership."
    ]
  },
  {
    "field": "AIR_Lifecycle",
    "dimension": "AI Lifecycle & Development Controls",
    "text": "How are AI models, prompts and automations built and changed?",
    "options": [
      "Ad hoc, no version control, documentation or separation from production.",
      "Basic versioning and some documentation, with an informal review before go-live.",
      "Defined stages with peer review and approval gates before anything goes live.",
      "Automated pipelines test quality, bias and drift at every stage."
    ]
  },
  {
    "field": "AIR_Third_Party",
    "dimension": "Third-Party & Vendor AI Risk",
    "text": "How do you evaluate AI vendors and AI features inside the software you buy?",
    "options": [
      "We don't assess them; vendor AI use is opaque to us.",
      "Key AI vendors are identified, and a basic questionnaire is used for new purchases.",
      "AI risk is part of procurement, and contracts include AI-specific obligations.",
      "Vendors are monitored continuously, and incidents trigger automatic escalation."
    ]
  },
  {
    "field": "AIR_Transparency",
    "dimension": "Transparency, Explainability & Fairness",
    "text": "Can you explain how your AI reaches its outputs, and check it for bias?",
    "options": [
      "No, AI outputs are a black box and bias isn't considered.",
      "Some high-impact uses have explanations; fairness is defined informally.",
      "Explainability and bias testing are required before release, and users are told when AI is used.",
      "Fairness is monitored automatically, with a way for affected people to challenge outcomes."
    ]
  },
  {
    "field": "AIR_Incident_Response",
    "dimension": "Incident Response & Monitoring",
    "text": "What happens when an AI tool gets something wrong?",
    "options": [
      "It's handled informally, if at all; nobody monitors AI after it goes live.",
      "AI issues go through our general IT incident process; basic thresholds exist for key tools.",
      "There's a dedicated AI incident process, performance dashboards and alerts for degradation.",
      "Real-time monitoring covers all AI, with automated triage feeding lessons back into development."
    ]
  },
  {
    "field": "AIR_Training_Culture",
    "dimension": "Awareness, Training & Culture",
    "text": "How prepared is your team to use AI safely?",
    "options": [
      "There's no guidance; people use AI tools however they like.",
      "Some awareness sessions have been held, but training is one-off.",
      "Everyone who uses AI gets role-based training on responsible use.",
      "A center of excellence drives continuous learning, backed by leadership."
    ]
  },
  {
    "field": "AIR_Policy_Docs",
    "dimension": "Policy & Documentation",
    "text": "Do you have written AI policies, and are your AI systems documented?",
    "options": [
      "No AI-specific policies; only general IT policies apply.",
      "A draft AI use policy exists but isn't approved; documentation is inconsistent.",
      "An approved AI policy suite is in place, and every AI system is documented and reviewed yearly.",
      "Policies are version-controlled and updated automatically when regulations or incidents change them."
    ]
  }
];

const RESULTS = [
  {
    "min": 10,
    "max": 14,
    "level": "Crawl",
    "color": "#D41409",
    "description": "AI is being used without guardrails. That usually means hidden risk: customer data flowing into unapproved tools, no clear owner, and no way to spot problems. The fastest win is a short, practical foundation: an AI use policy, an inventory of the tools in use, and clear accountability.",
    "services": [
      "AI Readiness Assessment (ISO 42001 / NIST AI RMF)",
      "AI Advisory & Consultancy"
    ]
  },
  {
    "min": 15,
    "max": 24,
    "level": "Walk",
    "color": "#7030A0",
    "description": "You have some awareness and a few good habits, but controls depend on individuals and aren't applied consistently. Closing the gaps now, before AI use grows, is far cheaper than fixing an incident later.",
    "services": [
      "AI Readiness Assessment (gap analysis and roadmap)",
      "AI Advisory & Consultancy"
    ]
  },
  {
    "min": 25,
    "max": 34,
    "level": "Run",
    "color": "#6C4FA3",
    "description": "Your governance foundations are in place. You're ready to scale AI safely, moving from pilots to AI embedded in real workflows, with the controls to prove it's working.",
    "services": [
      "AI Advisory & Consultancy",
      "Agentic AI-Based Transformation"
    ]
  },
  {
    "min": 35,
    "max": 40,
    "level": "Fly",
    "color": "#350F88",
    "description": "Your AI governance is mature and measurable. Now is the time to put agentic AI to work across operations and delivery, and turn responsible AI into a competitive advantage.",
    "services": [
      "Agentic AI-Based Transformation"
    ]
  }
];

const LEVELS = ["Crawl", "Walk", "Run", "Fly"];
const CONTACT_STEP = QUESTIONS.length;
const RESULT_STEP = QUESTIONS.length + 1;

let currentStep = -1; // -1 = welcome
let answers = new Array(QUESTIONS.length).fill(null);
let contact = { first: "", last: "", email: "", company: "", phone: "", notes: "", call: false };
let sent = false;

function getResult(score) {
  return RESULTS.find(r => score >= r.min && score <= r.max) || RESULTS[RESULTS.length - 1];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const app = document.getElementById('app');
  if (currentStep === -1) renderWelcome(app);
  else if (currentStep < QUESTIONS.length) renderQuestion(app, currentStep);
  else if (currentStep === CONTACT_STEP) renderContact(app);
  else renderResult(app);
}

function renderWelcome(app) {
  app.innerHTML = `
    ${LOGO_HTML}
    <div class="card-header">
      <h1>How Ready Is Your Business for AI?</h1>
      <p>Take a 5-minute assessment to see how safely and effectively you're adopting AI, and what to fix first.</p>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:0%"></div></div>
    <div class="card-body">
      <div class="welcome-title">Your free AI Readiness Assessment</div>
      <div class="welcome-desc">
        Answer 10 questions covering AI governance, data privacy, risk, vendors, people and policy. Each area is rated
        Crawl, Walk, Run or Fly. You'll get an overall readiness level, the areas to focus on first, and a recommended next step.
        Built on ISO/IEC 42001 and the NIST AI Risk Management Framework.
      </div>
      <div class="meta-chips">
        <span class="chip">5 minutes</span>
        <span class="chip">10 questions</span>
        <span class="chip">Instant results</span>
        <span class="chip">ISO 42001 and NIST AI RMF</span>
      </div>
      <div class="nav">
        <button class="btn btn-primary" onclick="startAssessment()">Start Assessment</button>
      </div>
    </div>
  `;
}

function renderQuestion(app, index) {
  const q = QUESTIONS[index];
  const progress = Math.round((index / QUESTIONS.length) * 100);
  const selected = answers[index];

  const optionsHTML = q.options.map((opt, i) => `
    <button class="option ${selected === i + 1 ? 'selected' : ''}" onclick="selectAnswer(${i + 1})">
      <span class="option-dot"></span>
      <span class="option-text"><strong>${LEVELS[i]}:</strong> ${opt}</span>
    </button>
  `).join('');

  app.innerHTML = `
    ${LOGO_HTML}
    <div class="card-header">
      <h1>AI Readiness Assessment</h1>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
    <div class="card-body">
      <div class="dimension-label">${q.dimension}</div>
      <div class="question-text">${q.text}</div>
      <div class="question-hint">Pick the statement closest to where you are today.</div>
      <div class="options">${optionsHTML}</div>
      <div class="nav">
        ${index > 0 ? `<button class="btn btn-secondary" onclick="prevQuestion()"></button>` : ''}
        <button class="btn btn-primary" onclick="nextQuestion()" ${selected === null ? 'disabled' : ''}>
          ${index < QUESTIONS.length - 1 ? 'Next' : 'Continue'}
        </button>
        <span class="q-counter">${index + 1} / ${QUESTIONS.length}</span>
      </div>
    </div>
  `;
}

function renderContact(app) {
  app.innerHTML = `
    ${LOGO_HTML}
    <div class="card-header">
      <h1>Your results are ready</h1>
      <p>Tell us where to send a copy, or skip straight to your score.</p>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:100%"></div></div>
    <div class="card-body">
      <form id="contact-form" onsubmit="return submitContact(event)" novalidate>
        <div class="hp" aria-hidden="true"><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
        <div class="field-row">
          <div class="field"><label for="first">First name</label><input id="first" maxlength="40" required value="${esc(contact.first)}"></div>
          <div class="field"><label for="last">Last name</label><input id="last" maxlength="80" required value="${esc(contact.last)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="email">Work email</label><input id="email" type="email" maxlength="80" required value="${esc(contact.email)}"></div>
          <div class="field"><label for="company">Company</label><input id="company" maxlength="40" required value="${esc(contact.company)}"></div>
        </div>
        <div class="field"><label for="phone">Phone (optional)</label><input id="phone" type="tel" maxlength="40" value="${esc(contact.phone)}"></div>
        <div class="field"><label for="notes">Anything about your AI plans or concerns? (optional)</label><textarea id="notes" maxlength="2000">${esc(contact.notes)}</textarea></div>
        <label class="call-check"><input type="checkbox" id="call" ${contact.call ? 'checked' : ''}>
          <span>Yes, book me a <strong>free 20-minute Discovery Call</strong> to talk through my results. No obligation.</span></label>
        <div class="form-error" id="form-error" role="alert"></div>
        <div class="nav">
          <button type="button" class="btn btn-secondary" onclick="prevQuestion()"></button>
          <button type="submit" class="btn btn-primary" id="send-btn">See My Results</button>
        </div>
        <button type="button" class="skip-link" onclick="skipContact()">Skip, just show my results</button>
        <div class="fine-print">We use your details only to send your results and follow up if you ask us to.</div>
      </form>
    </div>
  `;
}

function submitContact(e) {
  e.preventDefault();
  const form = document.getElementById('contact-form');
  const err = document.getElementById('form-error');
  const v = id => document.getElementById(id).value.trim();
  contact = { first: v('first'), last: v('last'), email: v('email'), company: v('company'), phone: v('phone'),
              notes: v('notes'), call: document.getElementById('call').checked };
  if (document.getElementById('hp').value) { currentStep = RESULT_STEP; render(); return false; }  // bot: show result, send nothing
  if (!form.checkValidity()) { err.textContent = 'Please fill in your name, a valid email and your company, or use "Skip" below.'; form.reportValidity(); return false; }

  const d = new Date(), f = SALESFORCE.fields;
  const data = new URLSearchParams({
    oid: SALESFORCE.oid, lead_source: 'AI Readiness Assessment',
    first_name: contact.first, last_name: contact.last, email: contact.email, company: contact.company, phone: contact.phone,
    [f.date]: (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear()
  });
  if (contact.notes) data.append(f.notes, contact.notes);
  QUESTIONS.forEach((q, i) => data.append(f.domains[q.field], answers[i]));
  if (contact.call) data.append(f.callRequested, '1');

  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  // Show the result whatever happens; the visitor should never be blocked by a network problem.
  fetch(SALESFORCE.endpoint, { method: 'POST', mode: 'no-cors', body: data })
    .then(() => { sent = true; })
    .catch(() => { sent = false; })
    .finally(() => { currentStep = RESULT_STEP; render(); });
  return false;
}

function skipContact() {
  sent = false;
  currentStep = RESULT_STEP;
  render();
}

function focusAreas() {
  // The lowest-scoring areas (up to two), in question order among ties.
  const min = Math.min(...answers);
  const lowest = QUESTIONS.filter((q, i) => answers[i] === min).slice(0, 2);
  return { level: LEVELS[min - 1], names: lowest.map(q => q.dimension) };
}

function renderResult(app) {
  const score = answers.reduce((sum, val) => sum + (val || 0), 0);
  const result = getResult(score);
  const focus = focusAreas();
  const servicesHTML = result.services.map(s => `<li>${s}</li>`).join('');
  const focusHTML = focus.names.map(n => `<li>${n} <span style="font-weight:500;color:#5A5A5A">(${focus.level})</span></li>`).join('');
  const scaleHTML = LEVELS.map(l => `<span class="${l === result.level ? 'on' : ''}">${l}</span>`).join('');
  const note = sent
    ? `<div class="sent-note">Thanks, ${esc(contact.first)}. We've received your results${contact.call ? ' and will contact you within one business day to book your Discovery Call' : ''}.</div>`
    : '';
  const cta = sent && contact.call
    ? ''
    : `<a href="mailto:info@capabilitymethods.com?subject=AI%20Readiness%20Assessment%20-%20${encodeURIComponent(result.level)}" class="btn-cta">Book a Free Consultation</a>`;

  app.innerHTML = `
    ${LOGO_HTML}
    <div class="card-header">
      <h1>Your AI Readiness Results</h1>
      <p>Here's how ready your business is to adopt AI safely.</p>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:100%"></div></div>
    <div class="card-body">
      ${note}
      <div class="result-badge">
        <span class="level-dot" style="background:${result.color}"></span>
        <span class="level-name">${result.level}</span>
      </div>
      <div class="result-score">${score}<span style="font-size:24px;font-weight:500;color:#5A5A5A"> / 40</span></div>
      <div class="result-score-label">Your AI readiness score</div>
      <div class="level-scale">${scaleHTML}</div>
      <div class="result-desc">${result.description}</div>
      <div class="result-services">
        <div class="result-services-label">Where to focus first</div>
        <ul class="service-list">${focusHTML}</ul>
      </div>
      <div class="result-services">
        <div class="result-services-label">Recommended next step</div>
        <ul class="service-list">${servicesHTML}</ul>
      </div>
      <div class="result-cta-wrap">
        ${cta}
        <button class="btn-retake" onclick="retake()">Retake Assessment</button>
      </div>
    </div>
  `;
}

function startAssessment() { currentStep = 0; render(); }
function selectAnswer(value) { answers[currentStep] = value; render(); }
function nextQuestion() { if (answers[currentStep] === null) return; currentStep++; render(); }
function prevQuestion() { if (currentStep > 0) { currentStep--; render(); } }
function retake() { currentStep = -1; answers = new Array(QUESTIONS.length).fill(null); sent = false; render(); }

render();
</script>
<script id="cm-height">
(function () {
  function send() { var bd = document.body, cs = getComputedStyle(bd); var h = Math.ceil(bd.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom)); parent.postMessage({cmEmbedHeight: h, src: location.pathname.split('/').pop()}, '*'); }
  window.addEventListener('load', send); window.addEventListener('resize', send);
  new MutationObserver(send).observe(document.documentElement, {subtree: true, childList: true, attributes: true, characterData: true});
  setInterval(send, 1000);
})();
</script>
</body>
